    <h1>欢迎！这是我的日记</h1>
    <p>这是我的日记，不是代码，仅仅是为了有趣而已！<br>
      欢迎大家通过PR请求纠正日记中的客观事实错误，或者留下"读者留言"。也可以提issues来提问相关话题、分享自己的经历、做出感慨、表达自己的想法……<br>
      也欢迎大家fork这个仓库，一起打开脑洞改写：如果当时是这样的，故事会怎么继续。<br>
      至于更新……随缘吧！只要我没有将这个存储库标记为公共存档，它就没有停止更新，只不过更新得很慢而已。<br>
      注意：如果你想要互动，请移步至<a href="https://github.com/ZhedongHu/Diary/tree/main">仓库的main分支</a>，并遵守README里的互动规则。</p>
    <p><a href="all-diary.html">开始阅读我的日记</a></p>
